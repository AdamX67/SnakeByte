# Snakebyte static-host firewall baseline
# Replace the certificate paths and root, then include these blocks inside http {}.
# This is a deployment control: it runs before the browser page loads and
# cannot be bypassed by editing client-side JavaScript.

map $uri $snakebyte_cache_control {
    default                     "no-store";
    ~*^/(?:images|fonts)/       "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/ssl/certs/snakebyte.pem;
    ssl_certificate_key /etc/ssl/private/snakebyte.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Static game: no writes, uploads, mutations, or API traffic.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # Never expose dotfiles, VCS metadata, secrets, or build artifacts.
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(?:map|log|env|pem|key|p12|sql|bak|old|tmp|git|svn)$ {
        deny all;
    }
    location ~* (?:wp-admin|wp-login\.php|xmlrpc\.php|\.git/|\.env|/cgi-bin/) {
        deny all;
    }
    # Reject obvious path-traversal probes.
    location ~ \.\./ {
        deny all;
    }

    location / {
        limit_except GET HEAD OPTIONS {
            deny all;
        }
        try_files $uri $uri/ =404;
    }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; script-src-attr 'none'; style-src-attr 'none'; require-trusted-types-for 'script'; trusted-types 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(self), battery=(), browsing-topics=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), speaker-selection=(), usb=(), web-share=(), window-management=(), xr-spatial-tracking=()" always;
    add_header Cache-Control $snakebyte_cache_control always;
    add_header X-Snakebyte-Firewall "deny-by-default" always;
}
