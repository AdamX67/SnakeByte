name: Security and release checks

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Type-check and build sealed bundle
        run: |
          npm run typecheck
          npm run build
      - name: Static security release audit
        run: npm run security-check
      - name: Unit and security logic tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser, CSP, and local-data tests
        run: npm run test:e2e
